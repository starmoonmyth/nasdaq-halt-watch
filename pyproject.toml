[project]
name = "nasdaq-halt-watch"
version = "0.1.0"
description = "Normalize and monitor Nasdaq Trader official trading-halt RSS events"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "starmoonmyth"}]
keywords = ["nasdaq", "trading-halt", "market-data", "rss", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["httpx>=0.27", "feedparser>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[project.urls]
Documentation = "https://github.com/starmoonmyth/nasdaq-halt-watch"
Issues = "https://github.com/starmoonmyth/nasdaq-halt-watch/issues"
Source = "https://github.com/starmoonmyth/nasdaq-halt-watch"
